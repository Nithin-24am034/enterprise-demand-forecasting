<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Demand Forecasting Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800 font-sans p-8">

    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="bg-blue-600 p-6 text-white flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">Enterprise Demand Forecasting</h1>
                <p class="text-sm opacity-80 mt-1">Custom Date Inference</p>
            </div>
        </div>

        <div class="p-6">
            <div class="grid grid-cols-3 gap-6 mb-6">
                <!-- Store Selection -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Select Store</label>
                    <select id="storeId" class="w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50">
                        <option value="store_1">Store 1</option>
                        <option value="store_2">Store 2</option>
                        <option value="store_3">Store 3</option>
                        <option value="store_4">Store 4</option>
                        <option value="store_5">Store 5</option>
                    </select>
                </div>

                <!-- Item Selection -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Select Item</label>
                    <select id="itemId" class="w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50">
                        <option value="item_1">Item 1</option>
                        <option value="item_10">Item 10</option>
                        <option value="item_25">Item 25</option>
                        <option value="item_50">Item 50</option>
                    </select>
                </div>

                <!-- Custom Date Picker -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Target Date</label>
                    <input type="date" id="targetDate"
                        class="w-full border border-gray-300 rounded-lg p-2 bg-gray-50 text-gray-700"
                        value="2024-03-15">
                </div>
            </div>

            <button onclick="generateForecast()"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200">
                Generate Target Forecast
            </button>

            <!-- Results Panel -->
            <div id="resultCard" class="mt-8 hidden bg-blue-50 border border-blue-100 rounded-lg p-6 text-center">
                <p class="text-gray-500 text-sm uppercase tracking-wide font-semibold mb-1">Projected Demand for <span
                        id="displayDate" class="text-blue-600"></span></p>
                <h2 class="text-5xl font-extrabold text-blue-700 my-2"><span id="salesVolume">0</span> <span
                        class="text-2xl text-blue-500 font-medium">units</span></h2>
                <p class="text-sm text-gray-600 mt-2">Target: <span id="displayCombo" class="font-medium"></span></p>
            </div>

            <!-- Error Panel -->
            <div id="errorCard"
                class="mt-8 hidden bg-red-50 border border-red-100 rounded-lg p-4 text-red-700 text-center text-sm">
                Error generating forecast. Ensure date is in the future.
            </div>
        </div>
    </div>

    <script>
        async function generateForecast() {
            const store = document.getElementById('storeId').value;
            const item = document.getElementById('itemId').value;
            const customDate = document.getElementById('targetDate').value;

            const resultCard = document.getElementById('resultCard');
            const errorCard = document.getElementById('errorCard');

            resultCard.classList.add('hidden');
            errorCard.classList.add('hidden');

            try {
                const response = await fetch('http://127.0.0.1:8000/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        store_id: store,
                        item_id: item,
                        target_date: customDate
                    })
                });

                if (!response.ok) throw new Error('API request failed');

                const data = await response.json();

                document.getElementById('displayDate').innerText = data.forecast_date;
                document.getElementById('salesVolume').innerText = data.predicted_sales;
                document.getElementById('displayCombo').innerText = `${data.store.replace('_', ' ').toUpperCase()} | ${data.item.replace('_', ' ').toUpperCase()}`;

                resultCard.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                errorCard.classList.remove('hidden');
            }
        }
    </script>
</body>

</html>
